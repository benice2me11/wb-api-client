  /api/v3/dbw/orders/stickers:
    post:
      description: |
        Returns a list of stickers for the [assembly orders](/openapi/orders-dbw#tag/DBW-Assembly-Orders/paths/~1api~1v3~1dbw~1orders~1new/get) in the [statuses](/openapi/orders-dbw#tag/DBW-Assembly-Orders/paths/~1api~1v3~1dbw~1orders~1status/post):
          - `confirm` — on assembly
          - `complete` — on delivery

        You can get a maximum of 100 stickers per request.<br>
        Available sticker formats:
          - SVG
          - ZPLV (vertical)
          - ZPLH (horizontal)
          - PNG

        Available dimensions:
          - 580x400 px, with `width=58&height=40` in request
          - 400x300 px, with `width=40&height=30` in request

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Introduction/Rate-Limits">Request limit</a> per one seller's account for DBW methods:
        <ul>
            <li>for getting and updating contact lists</li>
            <li>for getting and deleting metadata</li>
            <li>assembly orders</li>
        </ul>

        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 300 requests | 200 ms | 20 requests |

        One request with a response code of <code>409</code> is counted as 10 requests
        </div>
      parameters:
      - description: Sticker format
        explode: true
        in: query
        name: type
        required: true
        schema:
          enum:
          - svg
          - zplv
          - zplh
          - png
          type: string
        style: form
      - description: Sticker width
        explode: true
        in: query
        name: width
        required: true
        schema:
          enum:
          - 58
