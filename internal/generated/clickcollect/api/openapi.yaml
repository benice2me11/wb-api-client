              - [Details for the Acquiring Expenses Reports by Report ID](./financial-reports-and-accounting#tag/Financial-Reports/operation/postV1AcquiringDetailedReportId)
              - [Details for the Acquiring Expenses Reports by Period](./financial-reports-and-accounting#tag/Financial-Reports/operation/postV1AcquiringDetailed)
          type: string
        createdAt:
          description: Date and time the assembly order was created
          format: date-time
          type: string
        warehouseAddress:
          description: |
            Store address (seller warehouse) where the assembly order was received
          type: string
        orderCode:
          description: |
            Unique buyer order ID
          type: string
        payMode:
          description: |
            Pay mode:
              - `prepaid` — prepaid
              - `postpaid` — postpaid
              - `unknown` — unknown
          example: prepaid
          type: string
        skus:
          description: Items SKU array
          items:
            type: string
          type: array
        id:
          description: Assembly order ID
          type: integer
        warehouseId:
          description: |
            Seller warehouse ID where the assembly order was received
          type: integer
        nmId:
          description: WB item number
          type: integer
        chrtId:
          description: Item size ID in WB system
          type: integer
        price:
          description: |
            The price in the currency of sale including all discounts, except WB Wallet discount, multiplied by 100. You can find a currency code in the `currencyCode`. Provided for informational purposes only
          type: integer
        finalPrice:
          description: "The sum charged to the buyer in the currency of sale including\
            \ all discounts, multiplied by 100. You can find a currency code in the\
            \ `currencyCode` field. Provided for informational purposes only."
          example: 1014
          type: integer
        convertedPrice:
          description: "The price in the currency of the seller country including\
            \ all discounts, except WB Wallet discount, multiplied by 100. You can\
            \ find a currency code in the `currencyCode` field. Provided for informational\
            \ purposes only"
          example: 5000
          type: integer
        convertedFinalPrice:
          description: "The sum charged to the buyer in the currency of the seller\
            \ country including all discounts, multiplied by 100. Provided for informational\
            \ purposes only"
          example: 1014
          type: integer
        currencyCode:
          description: Sale currency code
          example: 643
          format: ISO 4217
          type: integer
        convertedCurrencyCode:
          description: Seller country currency code
          example: 643
          format: ISO 4217
          type: integer
        cargoType:
          description: |
            Type of cargo:
              - `1` — small-sized items
              - `2` — over dimensional cargo (ODC)
              - `3` — dimensional cargo+ (CD+)
          enum:
          - 1
          - 2
          - 3
          nullable: false
          type: integer
        isZeroOrder:
          description: |
            Indicator of an order for a item with zero inventory:
              - `false` — the order is made for a item with a non-zero inventory
              - `true` — the order is made for a item with zero inventory. Such an order can be canceled without a cancellation fee
          type: boolean
      type: object
