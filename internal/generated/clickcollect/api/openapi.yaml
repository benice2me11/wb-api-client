    MetaDetailsErrors_inner:
      properties:
        key:
          description: Label identifier
          example: uin
          type: string
        value:
          description: Label identifier value
          nullable: true
          type: string
          example: null
        decision:
          description: |
            Label identifiers validation errors. <br>
            - `imei`
              - `pending` — Label identifier validation continues. Wait for the validation status to change
              - `required` — Required label identifier is not added to the assembly order
              - `imeiInvalidFormat` — Invalid format
              - `imeiAlreadySold` — The item with this IMEI has already been sold
            - `uin`
              - `required` — Маркировка обязательна и не закреплена за сборочным заданием
            - `sgtin`
              - `pending` — Label identifier validation continues. Wait for the validation status to change
              - `required` — Required label identifier is not added to the assembly order
              - `sgtinInvalidFormat` — Invalid format
              - `sgtinNotFound` — Label identifier not found in [Chestny ZNAK](https://chestnyznak.ru/en/)
              - `sgtinEmitted` —  Label identifier has been issued
              - `sgtinApplied` — Putting into circulation not completed
              - `sgtinWrittenOff` — Written off
              - `sgtinRetired` — Retired
              - `sgtinWithdrawn` — Withdrawn
              - `sgtinDisaggregated` — Disaggregated
              - `sgtinDisaggregation` — Disaggregation
              - `sgtinAppliedNotPaid` — Not paid
            - `gtin`
              - `required` — Required label identifier is not added to the assembly order
            - `expiration`
              - `required` — Required label identifier is not added to the assembly order
            - `customsDeclaration`
              - `required` — Required label identifier is not added to the assembly order
          example: uinMaySell
          type: string
      type: object
    api_OrdersMetaDetailsResponse_orders_inner_errors_inner:
      properties:
        code:
          description: Error code
          example: 404
          type: integer
        detail:
          description: Additional error data
          example: NotFound
          type: string
      required:
      - code
      - detail
      type: object
    api_OrdersMetaDetailsResponse_orders_inner_metaDetails_inner:
      example:
        decision: imeiInvalidFormat
        value: "359876543210025"
        key: imei
      properties:
        key:
          description: Label identifier
          example: imei
          type: string
        value:
          description: Label identifier value
          example: "359876543210025"
          nullable: true
          type: string
        decision:
          description: |
            Label identifiers validation statuses. <br>
