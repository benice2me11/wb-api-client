  /api/v3/orders:
    get:
      description: |
        Returns assembly orders information without current status. <br>You can get data for a specified period, maximum of 30 calendar days per request.

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Introduction/Rate-Limits">Request limit</a> per one seller's account for <strong>FBS assembly orders, supplies and passes</strong> methods:

        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 300 requests | 200 ms | 20 requests |

        One request with a response code of <code>409</code> is counted as 10 requests
        </div>
      parameters:
      - description: Pagination parameter. Sets the limit for the amount of data returned.
        explode: true
        in: query
        name: limit
        required: true
        schema:
          maximum: 1000
          minimum: 1
          type: integer
        style: form
      - description: "Pagination parameter. Sets the value from which to retrieve\
          \ the next batch. It should start at 0 to get the full list of data. For\
          \ the subsequent requests, you must take the value from the `next` field\
          \ in the response."
        explode: true
        in: query
        name: next
        required: true
        schema:
          format: int64
          type: integer
        style: form
      - description: |
          Period start date in Unix timestamp format. By default date is 30 days before the request
        explode: true
        in: query
        name: dateFrom
        required: false
        schema:
          type: integer
        style: form
      - description: Period end date in Unix timestamp format
        explode: true
        in: query
        name: dateTo
        required: false
        schema:
          type: integer
        style: form
      responses:
