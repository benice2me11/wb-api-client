          description: ID of the WB warehouse associated with the seller's warehouse
          example: 123
          format: int64
          nullable: false
          type: integer
        nmId:
          description: WB article
          example: 123456789
          nullable: false
          type: integer
        chrtId:
          description: Product size ID in WB systems
          example: 987654321
          nullable: false
          type: integer
        price:
          description: |
            The price in the currency of sale, including all discounts except the amount from the WB Wallet, multiplied by 100. The currency code of the sale is in the `currencyCode` field
          example: 1014
          nullable: false
          type: integer
        finalPrice:
          description: "The sum charged to the buyer in the currency of sale including\
            \ all discounts, multiplied by 100. You can find a currency code in the\
            \ `currencyCode` field. Provided for informational purposes only"
          example: 1014
          type: integer
        convertedPrice:
          description: "The price in the currency of the seller's country including\
            \ all discounts, except WB Wallet discount, multiplied by 100. Provided\
            \ for informational purposes only."
          example: 28322
          nullable: false
          type: integer
        convertedFinalPrice:
          description: "The sum charged to the buyer in the currency of the seller's\
            \ country including all discounts, multiplied by 100. Provided for informational\
            \ purposes only"
          example: 1014
          type: integer
        currencyCode:
          description: Sale currency code
          example: 933
          format: ISO 4217
          nullable: false
          type: integer
        convertedCurrencyCode:
          description: Currency code of the supplier country
          example: 643
          format: ISO 4217
          nullable: false
          type: integer
        cargoType:
          description: |
            Type of cargo:
              - `1` — small-sized goods
              - `2` — over dimensional cargo (ODC)
              - `3` — dimensional cargo+ (CD+)
          enum:
          - 1
          - 2
          - 3
          nullable: false
          type: integer
        crossBorderType:
          description: |
            Assembly order type:
              - `0` — non-cross-border
              - `1` — cross-border
          enum:
          - 0
          - 1
          example: 1
          format: int32
          nullable: false
          type: integer
        isZeroOrder:
          description: |
            Indicator of an order for a product with zero inventory:
              - `false` — the order is made for a product with a non-zero inventory
              - `true` — the order is made for a product with zero inventory. Such an order can be canceled without a cancellation fee
          example: false
          type: boolean
        options:
          $ref: '#/components/schemas/Order_options'
      type: object
