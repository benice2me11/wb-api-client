      - description: Supply ID
        explode: false
        in: path
        name: supplyId
        required: true
        schema:
          example: WB-GI-1234567
          type: string
        style: simple
      - description: Sticker format
        explode: true
        in: query
        name: type
        required: true
        schema:
          enum:
