    Model409SupplyDeliverError_data_orders_inner_metaDetails_inner:
      example:
        decision: decision
        value: value
        key: key
      properties:
        key:
          description: Metadata
          type: string
        value:
          description: Metadata value
          type: string
        decision:
          description: |
            State:
            - `imei`
              - `pending` — Metadata for inspection
              - `required` — Required metadata is not filled
              - `imeiInvalidFormat` — Invalid format
              - `imeiAlreadySold` — The item with this IMEI has already been sold
            - `uin`
              - `required` — Required metadata is not filled
              - `pending` — Metadata for inspection
              - `uinInvalidFormat` — Invalid format
              - `uinBadStatus` — Invalid batch status
              - `uinBadProcess` — Invalid processing stage
              - `uinBadStatusAndBadProcess` — Invalid batch status. Invalid processing stage
              - `uinNotFound` — Not found in GIIS DMDK [https://minfin.gov.ru/ru/perfomance/jewels/dmdk].
                When you receive this error, make sure that the UIN:
                - is specified in the uploaded Delivery Contract Specification. If the specification was uploaded more than 30 minutes ago, [delete UIN](./orders-fbs#tag/FBS-Metadata/paths/~1api~1v3~1orders~1%7BorderId%7D~1meta/delete) from the assembly order and [add it](./orders-fbs#tag/FBS-Metadata/paths/~1api~1v3~1orders~1%7BorderId%7D~1meta~1uin/put) again
                - is registered in GIIS DMDK
                - is specified correctly and is read from the tag without errors
                - is in circulation
            - `sgtin`
              - `pending` — Metadata for inspection
              - `required` — Required metadata is not filled
              - `sgtinInvalidFormat` — Invalid format
              - `sgtinNotFound` — Metadata not found in [Chestny ZNAK](https://chestnyznak.ru/en/)
              - `sgtinEmitted` — Metadata has been issued
              - `sgtinApplied` — Putting into circulation not completed
              - `sgtinWrittenOff` — Written off
              - `sgtinRetired` — Retired
              - `sgtinWithdrawn` — Withdrawn
              - `sgtinDisaggregation` — Disaggregation
              - `sgtinDisaggregated` — Disaggregated
              - `sgtinAppliedNotPaid` — Not paid
            - `gtin`
              - `required` — Required metadata is not filled
            - `expiration`
              - `required` — Required metadata is not filled
            - `customsDeclaration`
              - `required` — Required metadata is not filled
          type: string
      type: object
    Model409SupplyDeliverError_data_orders_inner:
      example:
