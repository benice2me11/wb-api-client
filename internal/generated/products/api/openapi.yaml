  /content/v2/cards/error/list:
    post:
      description: |
        Returns the list of product cards ([drafts](https://seller.wildberries.ru/new-goods/error-cards)) and the list of errors encountered during product card creation or editing.
        <br><br>
        The data is returned in batches. One batch contains:
          - all errors for one `variants` array in one request during product cards [creation](/openapi/work-with-products#tag/Creating-Product-Cards/paths/~1content~1v2~1cards~1upload/post)
          - all errors in one request during product cards [creation with merge](/openapi/work-with-products#tag/Creating-Product-Cards/paths/~1content~1v2~1cards~1upload~1add/post) or [editing](/openapi/work-with-products#tag/Product-Cards/paths/~1content~1v2~1cards~1update/post).
        <br><br>
        To get more than 100 batches, use pagination:

          1. Make first request: <br>
              <pre style="background-color: rgb(38 50 56 / 5%); color: #e53935">
                {
                  "cursor": {
                    "limit": 100
                  },
                  "order": {
                    "ascending": true
                  }
                }</pre>
          2. Copy `"updatedAt":"***","batchUUID":"***"` from the response `cursor` and paste into the request `cursor`.
          3. Repeat the request.
          4. Repeat 2 and 3, until you receive in the response `"next":false`. This will mean that you have received all the batches.

        <div class="description_important">
          To delete product card from the errors list, repeat the request for creating or creating with merge and updating request with fixed errors
        </div>

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Introduction/Rate-Limits">Request limit</a> per one seller's account:

        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 10 requests | 6 s | 5 requests |
        </div>
      parameters:
      - description: |
          Language of subject names:
            - `ru` — Russian
            - `en` — English
            - `zh` — Chinese
        explode: true
        in: query
        name: locale
        required: false
        schema:
          example: en
          type: string
        style: form
      requestBody:
        content:
          application/json:
            example:
              cursor:
                limit: 31
                updatedAt: 2025-08-05T17:54:40+08:00
                batchUUID: bca3744c-1c8b-4588-b345-62af3b2899ae
              order:
                ascending: true
            schema:
              $ref: '#/components/schemas/requestPublicViewerPublicErrorsTableListV2'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                data:
                  items:
                  - batchUUID: b15fecaf-57fd-4b63-ab6f-18d630b8793e
                    subjects:
                      wb15j2kjk9:
                        id: 8827
                        name: Автомобили с пробегом
                      wb3g6advyh:
                        id: 8827
                        name: Автомобили с пробегом
                      wb3g7xx8g9:
                        id: 8827
                        name: Автомобили с пробегом
                      wb4uphjn61:
                        id: 8827
                        name: Автомобили с пробегом
