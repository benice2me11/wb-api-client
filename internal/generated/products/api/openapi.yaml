  /content/v2/cards/delete/trash:
    post:
      description: |
        Transfers the product card to the trash. In doing so, the product card would not be deleted.

        <div class="description_important">
          When transferring product cards to the trash, this product card is removed from the product card, meaning it is assigned a new <code>imtID</code> — merged product cards ID
        </div>

        After 30 days in the trash the product card would be deleted automatically. The trash is cleared every night according to Moscow time.<br>
        The product card can be deleted at any time in [personal account](https://seller.wildberries.ru/new-goods/basket-cards).
        <br><br>
        A card will remain for sale as long as there is any inventory left, even if moved to the trash. To completely remove the card from sale, set its inventory to zero.

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Introduction/Rate-Limits">Request limit</a> per one seller's account:

