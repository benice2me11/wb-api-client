        activationSource: jam
        level: premium
        state: active
        since: 2026-03-16T08:38:08.056406Z
      properties:
        state:
          description: |
            Subscription state:
              - `active` — active
              - `inactive` — expired or canceled
          enum:
          - active
          - inactive
          example: active
          type: string
        activationSource:
          description: |
            Subscription activation source:
              - `constructor` — purchased via the **Plan Builder** section
              - `jam` — purchased via the **Jam Subscription** section
          enum:
          - constructor
          - jam
          example: jam
          type: string
        level:
          description: |
            Subscription level:
              - `standard`
              - `advanced`
              - `premium`
          enum:
          - standard
          - advanced
          - premium
          example: premium
          type: string
        since:
          description: The date and time when the subscription was first activated.
